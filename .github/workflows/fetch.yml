name: Fetch Portfolio Prices

on:
  # ---- SCHEDULE PAUSED 2026-09-02 by Adam's instruction ("停止此 agent 的一切排程,
  # 直到我另行通知為止"). Uncomment the schedule block below to resume. Nothing else
  # was changed — workflow_dispatch and the push trigger still work. ----
  # schedule:
  #   # Close-of-day snapshots only. Intraday LIVE prices come from the client-side relay
  #   # (docs/js/app.js → abraham-quotes Worker, 30s during market hours) — not from
  #   # committing to git every N min (that bloated the repo). Adam 2026-07-03.
  #   # Taiwan market close + 1.5h buffer — Mon-Fri 15:00 Taipei = 07:00 UTC
  #   - cron: "0 7 * * 1-5"
  #   # US market close + 2h buffer — Tue-Sat 06:00 Taipei = 22:00 UTC (prev day)
  #   - cron: "0 22 * * 1-5"
  workflow_dispatch:  # Manual trigger button in Actions tab
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py
        continue-on-error: false

      - name: Compute holdings ATR trailing stops (即時持倉分頁)
        run: python scripts/holdings_atr.py
        # a holdings hiccup must never fail the price pipeline
        continue-on-error: true

      - name: Prune old snapshots (keep last 90 days)
        run: |
          cd data/snapshots
          ls -1 *.json 2>/dev/null | sort -r | tail -n +91 | xargs -r rm -v
          cd ../..

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update prices ${{ github.run_id }} [skip ci]"
          # data/snapshots/ removed from the pattern 2026-07-16 (Adam approved): dated
          # snapshot archives are local-only now (gitignored; repo was growing 15MB/day
          # with zero readers). Keeping an ignored path here would make git add fail and
          # kill the whole price-update commit. Local machines keep their own archives.
          # holdings-atr-state.json persists the ratchet (stop only moves up) across CI runs
          file_pattern: "docs/data/*.json data/holdings-atr-state.json"
          commit_user_name: "Abraham Bot"
          commit_user_email: "abraham-bot@users.noreply.github.com"
