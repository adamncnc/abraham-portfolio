<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abraham Portfolio Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=20260623">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <h1>💼 Abraham Portfolio</h1>
    <div class="subtitle">Adam 的持倉 + 觀察清單 · 自動抓資料</div>
  </div>
  <div class="header-right">
    <div class="timestamp" id="timestamp">Loading…</div>
    <div class="meta">
      <span class="pill" id="item-count">–</span>
      <button id="live-btn" class="btn-live" title="抓最新即時報價">🔄 抓即時</button>
      <button id="refresh-btn" class="btn-refresh" title="重新載入資料檔">↻</button>
    </div>
  </div>
</header>

<!-- Portfolio Summary -->
<section class="portfolio-summary" id="portfolio-summary">
  <!-- rendered by app.js -->
</section>

<!-- Market tabs: 台股 / 美股 / 指數 (Adam 2026-06-17: 上方三個標籤頁，各檔分門別類；黃金暫放指數頁) -->
<nav class="market-tabs" id="market-tabs">
  <button class="market-tab active" data-tab="tw">🇹🇼 台股 <span class="tab-count" id="tab-count-tw">–</span></button>
  <button class="market-tab" data-tab="us">🇺🇸 美股 <span class="tab-count" id="tab-count-us">–</span></button>
  <button class="market-tab" data-tab="idx">📊 指數 <span class="tab-count" id="tab-count-idx">–</span></button>
</nav>

<!-- 台股 -->
<section class="tab-panel active" id="panel-tw">
  <div class="section-header">
    <span class="section-count" id="tw-count">–</span>
    <select class="sort-select" data-section="tw" title="排序方式">
      <option value="default">預設順序</option>
      <option value="change">漲跌幅</option>
      <option value="zone">距進場區</option>
      <option value="growth">營收成長率</option>
      <option value="eps">EPS</option>
      <option value="pe">本益比(低→高)</option>
      <option value="name">名稱</option>
      <option value="custom">自訂(拖拉)</option>
    </select>
  </div>
  <div class="card-grid" id="tw-grid">
    <div class="loading">Loading…</div>
  </div>
</section>

<!-- 美股 -->
<section class="tab-panel" id="panel-us">
  <div class="section-header">
    <span class="section-count" id="us-count">–</span>
    <select class="sort-select" data-section="us" title="排序方式">
      <option value="default">預設順序</option>
      <option value="change">漲跌幅</option>
      <option value="zone">距進場區</option>
      <option value="growth">營收成長率</option>
      <option value="eps">EPS</option>
      <option value="pe">本益比(低→高)</option>
      <option value="name">名稱</option>
      <option value="custom">自訂(拖拉)</option>
    </select>
  </div>
  <div class="card-grid" id="us-grid">
    <div class="loading">Loading…</div>
  </div>
</section>

<!-- 指數 (含黃金) -->
<section class="tab-panel" id="panel-idx">
  <div class="section-header">
    <span class="section-count" id="idx-count">–</span>
    <select class="sort-select" data-section="idx" title="排序方式">
      <option value="default">預設順序</option>
      <option value="change">漲跌幅</option>
      <option value="name">名稱</option>
      <option value="custom">自訂(拖拉)</option>
    </select>
  </div>
  <div class="card-grid" id="idx-grid">
    <div class="loading">Loading…</div>
  </div>
</section>

<footer class="site-footer">
  <div>Abraham Financial Advisor Dashboard · v1.0</div>
  <div class="footer-meta">
    分析 ≠ 買進建議 · 決策在你 · 執行在券商<br>
    資料來源：Yahoo Finance via yfinance · 自動更新每個交易日
  </div>
  <div class="footer-meta">
    <a href="https://github.com/adamncnc/abraham-portfolio" target="_blank">Source on GitHub</a>
  </div>
</footer>

<!-- cache-bust app.js: always load the freshest dashboard code so updates show
     without a manual hard-refresh (the script is appended at end of body, so the
     DOM is fully parsed and chart.js/Sortable from <head> are already available). -->
<script>
  (function () {
    var s = document.createElement("script");
    s.src = "js/app.js?v=" + Date.now();
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
